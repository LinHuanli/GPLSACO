[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-faco"
version = "0.1.0"
description = "GP structural control for FACO: research implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "deap>=1.4,<2", "scipy>=1.14,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
